name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · three ${{ matrix.three }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        three: ["0.128.0", "0.184.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use three@${{ matrix.three }}
        run: npm install --no-save three@${{ matrix.three }}
      - name: Unit + regression tests
        run: npm test
      - name: Build browser bundle
        run: npm run build
      - name: Check the published package contents
        run: npm pack --dry-run

  bundle-smoke:
    name: Browser bundle smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: UMD bundle exposes BlockRig with a global THREE
        run: |
          node -e "
            const vm = require('vm'), fs = require('fs');
            import('three').then(THREE => {
              const ctx = { THREE, console }; ctx.globalThis = ctx; vm.createContext(ctx);
              vm.runInContext(fs.readFileSync('dist/blockrig.umd.min.js', 'utf8'), ctx);
              const B = ctx.BlockRig, rig = B.createRig();
              rig.addLayeredClothing(B.makeCoat());
              const a = new B.Animator(rig); a.play(B.clips.run); a.update(0.3);
              if (!rig.joints.includes('Neck')) throw new Error('bad bundle');
              console.log('UMD bundle OK:', Object.keys(B).length, 'exports');
            });"
