<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockRig IKControl</title>
<style>
  :root{--ink:#141012;--paper:#f6efe9;--muted:#a3948e;color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:600 14px/1.3 system-ui,-apple-system,Segoe UI,sans-serif}
  #wrap{position:relative;width:100%;height:100%} canvas{display:block;width:100%;height:100%}
  #labels{position:absolute;left:0;right:0;bottom:14px;display:grid;grid-template-columns:repeat(2,1fr);text-align:center;pointer-events:none}
  #labels span{display:block;color:var(--muted);font:500 12px ui-monospace,Consolas,monospace}
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js", "blockrig": "../src/index.js" } }
</script>
</head>
<body>
<div id="wrap"><div id="labels"><div>Reach + look<span>Position (pole) · LookAt</span></div><div>Foot on a step<span>Position on the leg · hipHeight</span></div></div></div>
<script type="module">
// IKControl on top of animation: a hand reaching for a moving orb while the head follows it, and a foot
// planted on a step. Original characters; nothing downloaded.
import * as THREE from "three";
import { createRig, Animator, clips } from "blockrig";

const SHOT = new URLSearchParams(location.search).has("shot");
const wrap = document.getElementById("wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: SHOT });
renderer.setPixelRatio(SHOT ? 1 : Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
wrap.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#141012");
scene.add(new THREE.HemisphereLight(0xfff2ea, 0x3a2a30, 2.8));
const key = new THREE.DirectionalLight(0xffffff, 2.8); key.position.set(6, 10, 12); scene.add(key);
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 200);
const floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.1, 6), new THREE.MeshStandardMaterial({ color: "#2a2226" })); floor.position.y = -0.05; scene.add(floor);
const face = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"); g.fillStyle = "#111"; g.strokeStyle = "#111"; g.lineWidth = 10; g.lineCap = "round"; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(128 + s * 40, 106, 11, 17, 0, 0, 7); g.fill(); } g.beginPath(); g.arc(128, 128, 54, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke(); return c; })();
const skin = (c, shirt, pants) => ({ HeadColor3: c, TorsoColor3: shirt, LeftArmColor3: c, RightArmColor3: c, LeftLegColor3: pants, RightLegColor3: pants });

// 1) reach for an orb, head looking at it
const a = createRig({ bodyColors: skin("#f2c94c", "#e63946", "#1d3557"), face, outline: 0.03 }); a.object.position.x = -3; scene.add(a.object);
const orb = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 16), new THREE.MeshStandardMaterial({ color: "#7ff5ff", emissive: "#2a8fb0", emissiveIntensity: 0.8 })); scene.add(orb);
const elbowPole = new THREE.Object3D(); scene.add(elbowPole);
a.addIKControl({ type: "Position", chainRoot: "RightUpperArm", endEffector: "RightGripAttachment", target: orb, pole: elbowPole });
a.addIKControl({ type: "LookAt", chainRoot: "UpperTorso", endEffector: "Head", target: orb, weight: 0.8 });
const animA = new Animator(a); animA.play(clips.idle, { fade: 0 });

// 2) one foot on a step: leg IK to the step's top, body lowered a touch with hipHeight
const b = createRig({ bodyColors: skin("#8d5a3b", "#00b894", "#2d3436"), face, outline: 0.03 }); b.object.position.set(3, 0, 0); b.object.rotation.y = -0.5; scene.add(b.object);
const step = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.9, 1.4), new THREE.MeshStandardMaterial({ color: "#6c5ce7" })); scene.add(step);
b.object.updateMatrixWorld(true);
const footRest = b.jointPosition("RightFoot");
step.position.set(footRest.x + 0.3, 0.45, footRest.z + 0.9);
const footTarget = new THREE.Vector3(step.position.x, 0.9 + 0.3, step.position.z); // ankle 0.3 above the step's top
const kneePole = new THREE.Object3D(); kneePole.position.set(footTarget.x, 3, footTarget.z + 4); scene.add(kneePole);
b.addIKControl({ type: "Position", chainRoot: "RightUpperLeg", endEffector: "RightFoot", target: () => footTarget.clone().add(new THREE.Vector3(0, -0.15, 0)), pole: kneePole });
b.hipHeight -= 0.15;
const animB = new Animator(b); animB.play(clips.idle, { fade: 0 });

function size() { const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; const t = Math.tan(THREE.MathUtils.degToRad(12)); cam.position.set(0, 4.2, Math.max(12 / (2 * t * cam.aspect), 7 / (2 * t))); cam.lookAt(0, 2.6, 0); cam.updateProjectionMatrix(); }
addEventListener("resize", size); size();
let t = SHOT ? 1.2 : 0; const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = SHOT ? 0 : Math.min(clock.getDelta(), 0.05); t += dt;
  orb.position.set(-3 - 0.9 + Math.cos(t * 0.9) * 0.9, 4.1 + Math.sin(t * 1.3) * 0.6, 1.3 + Math.sin(t * 0.9) * 0.4);
  elbowPole.position.set(-3 - 3, 2.5, -1);
  animA.update(SHOT ? 0.01 : dt); animB.update(SHOT ? 0.01 : dt);
  renderer.render(scene, cam); window.__ready = true;
});
</script>
</body>
</html>
