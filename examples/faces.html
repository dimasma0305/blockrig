<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockRig Expressions</title>
<style>
  :root{--ink:#141012;--paper:#f6efe9;--muted:#a3948e;color-scheme:dark}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font:600 14px/1.3 system-ui,-apple-system,Segoe UI,sans-serif}
  #wrap{position:relative;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%}
  #labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}
  #labels div{display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:600 13px ui-monospace,Consolas,monospace;color:var(--muted)}
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js", "blockrig": "../src/index.js" } }
</script>
</head>
<body>
<div id="wrap"><div id="labels"></div></div>
<script type="module">
import * as THREE from "three";
import { createRig, createFace, EXPRESSIONS } from "blockrig";

const SHOT = new URLSearchParams(location.search).has("shot");
const wrap = document.getElementById("wrap"), labels = document.getElementById("labels");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: SHOT });
renderer.setPixelRatio(SHOT ? 1 : Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;
wrap.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#141012");
scene.add(new THREE.HemisphereLight(0xfff2ea, 0x4a1a22, 3));
const key = new THREE.DirectionalLight(0xffffff, 3); key.position.set(3, 6, 10); scene.add(key);

// 18 head-and-shoulders busts in a 6 x 3 grid; each has its own live face
const names = ["neutral", "happy", "grin", "laugh", "smug", "wink", "determined", "angry", "furious", "roar", "shocked", "scared", "sad", "hurt", "sleepy", "embarrassed", "dazed", "talking"];
const skins = ["#f3d2b9", "#eec39a", "#c68a5c", "#8d5a3b", "#fbe6cf", "#f2c94c"];
const shirts = ["#e3172f", "#2f80ed", "#27ae60", "#6c5ce7", "#f4c430", "#00b894"];
const cols = 6, rows = 3, rigs = [];
names.forEach((n, i) => {
  const face = createFace({ expression: n === "talking" ? "happy" : n, blink: !SHOT, seed: i + 1 });
  if (n === "talking") face.talk(true);
  const rig = createRig({ face, body: { skin: skins[i % 6], shirt: shirts[(i * 5) % 6] }, outline: 0.03 });
  rig.object.rotation.y = 0.18;
  scene.add(rig.object); rigs.push(rig);
  labels.insertAdjacentHTML("beforeend", `<div>${n}</div>`);
});
// one close-up camera, drawn once per grid cell with only that cell's character visible
const cam = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
const headY = rigs[0].jointPosition("Neck").y + 0.55;
cam.position.set(0, headY + 0.25, 6.2); cam.lookAt(0, headY - 0.15, 0);
function resize() { renderer.setSize(wrap.clientWidth, wrap.clientHeight, false); }
addEventListener("resize", resize); resize();
renderer.setScissorTest(true);
function drawAll() {
  const W = wrap.clientWidth, H = wrap.clientHeight, cw = W / cols, ch = H / rows;
  cam.aspect = cw / ch; cam.updateProjectionMatrix();
  rigs.forEach((r, i) => {
    rigs.forEach((o, j) => (o.object.visible = i === j));
    const x = (i % cols) * cw, y = H - (Math.floor(i / cols) + 1) * ch;
    renderer.setViewport(x, y, cw, ch); renderer.setScissor(x, y, cw, ch);
    renderer.render(scene, cam);
  });
}
if (SHOT) { for (let k = 0; k < 30; k++) rigs.forEach((r) => r.updateFace(0.05)); drawAll(); window.__ready = true; }
else { const clock = new THREE.Clock(); renderer.setAnimationLoop(() => { const dt = clock.getDelta(); rigs.forEach((r) => r.updateFace(dt)); drawAll(); }); }
</script>
</body>
</html>
